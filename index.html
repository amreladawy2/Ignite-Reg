<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignite '26 — Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F3A;
    --navy-light:#132A4D;
    --pitch:#1F7A4D;
    --pitch-light:#2E9A63;
    --gold:#D4A62A;
    --chalk:#F2F5F0;
    --chalk-dim:#B9C4D4;
    --ember:#D8482E;
    --line: rgba(242,245,240,0.14);
    --skin:#C08A63;
    --skin-dk:#A87450;
    --hair:#1E1710;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ background:var(--navy); color:var(--chalk); font-family:'Manrope',sans-serif; overflow-x:hidden; }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }
  h1,h2,h3{ font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.02em; text-transform:uppercase; line-height:0.95; }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit; text-decoration:none;}

  /* ================= INTRO SHELL ================= */
  #intro{
    position:fixed; inset:0; background:#050B16; z-index:9999;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    transition:opacity 0.9s ease, visibility 0.9s ease;
  }
  #intro.done{ opacity:0; visibility:hidden; pointer-events:none; }

  .pitch-lines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(31,122,77,0.30) 0 60px, rgba(20,90,58,0.30) 60px 120px);
    transform:perspective(600px) rotateX(55deg) scale(2.2);
    transform-origin:bottom center; bottom:-10%; height:70%; width:100%;
    opacity:0; animation:pitchIn 1.2s ease forwards 0.1s;
  }
  @keyframes pitchIn{ to{opacity:1;} }

  .floodlights{ position:absolute; inset:0; display:flex; justify-content:space-between; pointer-events:none; }
  .floodlight-beam{ width:16%; height:100%; opacity:0; }
  .floodlight-beam:nth-child(1){ margin-left:2%; animation:beamOn 0.5s ease forwards 0.15s; }
  .floodlight-beam:nth-child(2){ margin-left:8%; animation:beamOn 0.5s ease forwards 0.3s; }
  .floodlight-beam:nth-child(3){ margin-right:8%; animation:beamOn 0.5s ease forwards 0.45s; }
  .floodlight-beam:nth-child(4){ margin-right:2%; animation:beamOn 0.5s ease forwards 0.6s; }
  @keyframes beamOn{ to{ opacity:1; background:radial-gradient(ellipse at top, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 70%); } }

  .sound-toggle{
    position:absolute; bottom:2rem; left:2rem; z-index:30;
    background:transparent; border:1px solid var(--line); color:var(--chalk-dim);
    font-family:'JetBrains Mono',monospace; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.6rem 1rem; border-radius:999px; cursor:pointer; transition:border-color 0.2s,color 0.2s;
  }
  .sound-toggle:hover, .sound-toggle.on{ border-color:var(--gold); color:var(--gold); }

  .replay-chip{
    position:fixed; bottom:1.4rem; left:1.4rem; z-index:500; display:none;
    background:var(--navy-light); border:1px solid var(--line); color:var(--chalk-dim);
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:0.55rem 0.95rem; border-radius:999px; cursor:pointer; transition:border-color 0.2s,color 0.2s;
  }
  .replay-chip:hover{ border-color:var(--gold); color:var(--gold); }
  body.intro-done .replay-chip{ display:block; }

  .skip-intro{
    position:absolute; bottom:2rem; right:2rem; z-index:30;
    background:transparent; border:1px solid var(--line); color:var(--chalk-dim);
    font-family:'JetBrains Mono',monospace; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.6rem 1rem; border-radius:999px; cursor:pointer; transition:border-color 0.2s,color 0.2s;
  }
  .skip-intro:hover{ border-color:var(--gold); color:var(--gold); }

  .caption{
    position:absolute; bottom:2.2rem; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:0.78rem; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold); opacity:0; transition:opacity 0.45s ease; z-index:30; white-space:nowrap;
  }
  .caption.show{ opacity:1; }

  /* ================= CAMERA ================= */
  .stage{ width:700px; height:437.5px; flex:none;
    transform:scale(var(--stage-s,1)); transform-origin:center center; }
  .camera{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transform-origin:50% 50%; will-change:transform;
    transition:transform 1s cubic-bezier(.42,.08,.2,1);
  }
  .camera.cam-kicker{ transform:scale(1.55) translate(8%, -14%); }
  .camera.cam-wide  { transform:scale(1.02) translate(0,0); }
  .camera.cam-goal  { transform:scale(1.42) translate(-12%, 18%); }
  .camera.cam-neutral{ transform:scale(1) translate(0,0); }
  .penalty-field.shake{ animation:camShake 0.4s ease-out; }
  @keyframes camShake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-7px,5px); }
    45%{ transform:translate(6px,-4px); }
    70%{ transform:translate(-3px,2px); }
    100%{ transform:translate(0,0); }
  }

  .penalty-field{ position:relative; width:100%; height:100%; z-index:2; }

  /* ================= GOAL ================= */
  .goal-frame{ position:absolute; left:50%; top:7%; transform:translateX(-50%); width:48%; height:23%; }
  .crossbar{ position:absolute; top:0; left:0; right:0; height:5px; background:var(--chalk); border-radius:3px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .post{ position:absolute; top:0; bottom:0; width:5px; background:var(--chalk); border-radius:3px; }
  .post-left{ left:0; } .post-right{ right:0; }
  .net{
    position:absolute; inset:5px 5px -8px 5px;
    background-image:
      repeating-linear-gradient(48deg, rgba(242,245,240,0.20) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(-48deg, rgba(242,245,240,0.20) 0 1px, transparent 1px 10px);
    transform-origin:top center;
  }
  .net{ transform-origin:92% 15%; }
  .net.ripple{ animation:netRipple 0.7s cubic-bezier(.2,.9,.3,1); }
  @keyframes netRipple{
    0%{ transform:scale(1); }
    25%{ transform:scaleX(1.04) scaleY(1.14); }
    55%{ transform:scaleX(0.99) scaleY(0.96); }
    80%{ transform:scaleX(1.01) scaleY(1.03); }
    100%{ transform:scale(1); }
  }

  /* ================= ARTICULATED FIGURES ================= */
  .fig{ position:absolute; width:62px; }
  .fig-svg{ width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 7px 9px rgba(0,0,0,0.45)); }

  .limb{ fill:none; stroke-linecap:round; }
  .thigh{ stroke-width:17; }
  .shin{ stroke-width:12.5; }
  .foot{ stroke-width:9.5; }
  .uarm{ stroke-width:12.5; }
  .farm{ stroke-width:10; }
  .neckline{ stroke-width:11.5; stroke-linecap:round; }
  .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:23px; text-anchor:middle; fill:var(--chalk); opacity:0.92; }

  .jt{ transform-box:view-box; }
  .hip-f{ transform-origin:66px 130px; }
  .hip-b{ transform-origin:54px 130px; }
  .knee-f{ transform-origin:65px 167px; }
  .knee-b{ transform-origin:53px 167px; }
  .ankle-f{ transform-origin:64px 195px; }
  .ankle-b{ transform-origin:52px 195px; }
  .sh-f{ transform-origin:73px 55px; }
  .sh-b{ transform-origin:47px 55px; }
  .el-f{ transform-origin:77px 81px; }
  .el-b{ transform-origin:43px 81px; }
  .torso-pivot{ transform-box:view-box; transform-origin:60px 112px;
    animation:idleSway 2.6s ease-in-out infinite alternate; }
  .fig-keeper .torso-pivot{ animation-delay:-.9s; }
  .fig-ref .torso-pivot{ animation-delay:-1.7s; }
  @keyframes idleSway{ from{ transform:rotate(-1.3deg); } to{ transform:rotate(1.3deg); } }
  .neckj{ transform-origin:60px 50px; }
  .root{ transform-box:view-box; transform-origin:60px 200px; }

  /* --- kicker --- */
  .fig-player{ left:37%; top:74%; transform:translate(-50%,-50%); width:66px; }
  .fig-player .jersey{ fill:var(--ember); }
  .fig-player .collar{ fill:var(--chalk); }
  .fig-player .shorts-p{ fill:var(--chalk); }
  .fig-player .sock{ stroke:#0E1420; }
  .fig-player .foot{ stroke:#F5D33A; }

  .fig-player.kick .root{ animation:runRoot 1.55s cubic-bezier(.35,0,.3,1) forwards; }
  .fig-player.kick .torso-pivot{ animation:torsoKick 1.55s ease-in-out forwards; }
  .fig-player.kick .hip-f{ animation:hipKick 1.55s cubic-bezier(.3,0,.25,1) forwards; }
  .fig-player.kick .knee-f{ animation:kneeKick 1.55s cubic-bezier(.3,0,.25,1) forwards; }
  .fig-player.kick .ankle-f{ animation:ankleKick 1.55s ease-out forwards; }
  .fig-player.kick .hip-b{ animation:hipPlant 1.55s ease-in-out forwards; }
  .fig-player.kick .knee-b{ animation:kneePlant 1.55s ease-in-out forwards; }
  .fig-player.kick .sh-f{ animation:armKickF 1.55s ease-in-out forwards; }
  .fig-player.kick .sh-b{ animation:armKickB 1.55s ease-in-out forwards; }
  .fig-player.kick .el-f{ animation:elbowF 1.55s ease-in-out forwards; }
  .fig-player.kick .el-b{ animation:elbowB 1.55s ease-in-out forwards; }
  .fig-player.kick .neckj{ animation:neckKick 1.55s ease-in-out forwards; }
  @keyframes neckKick{
    0%{ transform:rotate(6deg); } 36%{ transform:rotate(9deg); }
    60%{ transform:rotate(11deg); }                 /* eyes locked on the ball */
    72%{ transform:rotate(2deg); }
    100%{ transform:rotate(-9deg); }                /* head comes up to follow the flight */
  }

  /* run-up: three strides carrying the body forward, then plant */
  @keyframes runRoot{
    0%  { transform:translate(-34px, 15px); animation-timing-function:cubic-bezier(.2,.6,.4,1); }
    12% { transform:translate(-27px, 4px);  animation-timing-function:cubic-bezier(.55,0,.85,.5); }
    24% { transform:translate(-20px, 15px); animation-timing-function:cubic-bezier(.2,.6,.4,1); }
    36% { transform:translate(-11px, 3px);  animation-timing-function:cubic-bezier(.55,0,.85,.5); }
    48% { transform:translate(-4px, 13px);  animation-timing-function:cubic-bezier(.3,.5,.45,1); }
    62% { transform:translate(0px, 9px);    animation-timing-function:cubic-bezier(.4,0,.6,1); }
    72% { transform:translate(2px, 4px);    animation-timing-function:cubic-bezier(.5,0,.7,.5); }
    84% { transform:translate(5px, -5px);   animation-timing-function:cubic-bezier(.3,.6,.5,1); }
    100%{ transform:translate(7px, 0px); }
  }
  @keyframes torsoKick{
    0%,30%{ transform:rotate(-3deg); animation-timing-function:ease-in-out; }
    58%{ transform:rotate(-9deg); animation-timing-function:cubic-bezier(.5,0,.8,.5); }  /* lean into the plant */
    72%{ transform:rotate(4deg);  animation-timing-function:cubic-bezier(.15,.6,.35,1); }/* snap through contact */
    100%{ transform:rotate(8deg); }
  }
  @keyframes hipKick{
    0%  { transform:rotate(-14deg); animation-timing-function:ease-in-out; }
    12% { transform:rotate(20deg);  animation-timing-function:ease-in-out; }
    24% { transform:rotate(-16deg); animation-timing-function:ease-in-out; }
    36% { transform:rotate(22deg);  animation-timing-function:ease-in-out; }
    48% { transform:rotate(-10deg); animation-timing-function:cubic-bezier(.4,0,.6,1); }
    60% { transform:rotate(36deg);  animation-timing-function:cubic-bezier(.5,0,.85,.5); } /* loads back, accelerating in */
    72% { transform:rotate(-44deg); animation-timing-function:cubic-bezier(.1,.6,.3,1); }  /* max speed AT contact */
    86% { transform:rotate(-68deg); animation-timing-function:ease-out; }
    100%{ transform:rotate(-54deg); }
  }
  /* knees trail the hips by a couple of percent — drag is what sells the whip */
  @keyframes kneeKick{
    0%  { transform:rotate(30deg); animation-timing-function:ease-in-out; }
    14% { transform:rotate(6deg);  animation-timing-function:ease-in-out; }
    26% { transform:rotate(34deg); animation-timing-function:ease-in-out; }
    38% { transform:rotate(5deg);  animation-timing-function:ease-in-out; }
    50% { transform:rotate(30deg); animation-timing-function:cubic-bezier(.4,0,.6,1); }
    63% { transform:rotate(76deg); animation-timing-function:cubic-bezier(.5,0,.85,.5); } /* heel to the seat */
    74% { transform:rotate(-6deg); animation-timing-function:cubic-bezier(.1,.6,.3,1); }  /* whipped straight */
    88% { transform:rotate(8deg);  animation-timing-function:ease-out; }
    100%{ transform:rotate(18deg); }
  }
  @keyframes ankleKick{
    0%,58%{ transform:rotate(6deg);  animation-timing-function:cubic-bezier(.5,0,.8,.5); }
    64% { transform:rotate(16deg);   animation-timing-function:cubic-bezier(.4,0,.7,.4); } /* cocked */
    73% { transform:rotate(-24deg);  animation-timing-function:ease-out; }                 /* toe punched through */
    100%{ transform:rotate(-10deg); }
  }
  @keyframes hipPlant{
    0%  { transform:rotate(22deg); }
    12% { transform:rotate(-15deg); }
    24% { transform:rotate(20deg); }
    36% { transform:rotate(-17deg); }
    48% { transform:rotate(24deg); }
    62% { transform:rotate(-9deg); }         /* foot planted beside the ball */
    100%{ transform:rotate(-6deg); }
  }
  @keyframes kneePlant{
    0%  { transform:rotate(8deg); }
    12% { transform:rotate(32deg); }
    24% { transform:rotate(6deg); }
    36% { transform:rotate(34deg); }
    48% { transform:rotate(8deg); }
    62% { transform:rotate(14deg); }
    72% { transform:rotate(6deg); }
    100%{ transform:rotate(9deg); }
  }
  @keyframes armKickF{
    0%{ transform:rotate(28deg); } 24%{ transform:rotate(-24deg); }
    48%{ transform:rotate(30deg); } 62%{ transform:rotate(-38deg); }
    72%{ transform:rotate(-52deg); } 100%{ transform:rotate(-44deg); }
  }
  @keyframes armKickB{
    0%{ transform:rotate(-26deg); } 24%{ transform:rotate(26deg); }
    48%{ transform:rotate(-28deg); } 62%{ transform:rotate(44deg); }
    72%{ transform:rotate(58deg); } 100%{ transform:rotate(50deg); }
  }
  @keyframes elbowF{ 0%,48%{ transform:rotate(-30deg); } 72%{ transform:rotate(-52deg); } 100%{ transform:rotate(-46deg); } }
  @keyframes elbowB{ 0%,48%{ transform:rotate(34deg); } 72%{ transform:rotate(56deg); } 100%{ transform:rotate(48deg); } }

  /* --- keeper --- */
  .fig-keeper{
    left:50%; top:26%; transform:translate(-50%,-50%); width:58px; z-index:4;
    transition:transform 0.62s cubic-bezier(.28,.66,.3,1);
  }
  .fig-keeper .jersey{ fill:#101A2B; }
  .fig-keeper .collar{ fill:var(--gold); }
  .fig-keeper .shorts-p{ fill:#101A2B; }
  .fig-keeper .sock{ stroke:#101A2B; }
  .fig-keeper .foot{ stroke:#0A0C10; }
  .fig-keeper .glove{ fill:var(--gold); }

  /* crouch and shift weight before the strike */
  .fig-keeper.set .knee-f{ transform:rotate(26deg); }
  .fig-keeper.set .knee-b{ transform:rotate(26deg); }
  .fig-keeper.set .hip-f{ transform:rotate(-14deg); }
  .fig-keeper.set .hip-b{ transform:rotate(14deg); }
  .fig-keeper.set .sh-f{ transform:rotate(-42deg); }
  .fig-keeper.set .sh-b{ transform:rotate(42deg); }
  .fig-keeper .jt{ transition:transform 0.35s ease; }
  .fig-keeper.set .torso-pivot, .fig-keeper.dive .torso-pivot{ animation:none; }
  .fig-keeper.set .fig-svg{ animation:keeperBounce .5s ease-in-out infinite; }
  .fig-keeper.dive .fig-svg{ animation:none; }
  @keyframes keeperBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  /* anticipation: reads the swing, sinks onto his heels before exploding */
  .fig-keeper.load{ transform:translate(-50%,-42%) rotate(2deg); transition:transform .15s cubic-bezier(.4,0,.7,.4); }
  .fig-keeper.load .sh-f{ transform:rotate(-56deg); }
  .fig-keeper.load .sh-b{ transform:rotate(56deg); }
  .fig-keeper.load .knee-f{ transform:rotate(34deg); }
  .fig-keeper.load .knee-b{ transform:rotate(34deg); }

  /* dive: explosive push-off, then ballistic float into full extension */
  .fig-keeper.dive{ transform:translate(47%, -76%) rotate(55deg);
    animation:keeperDive .6s forwards; }
  @keyframes keeperDive{
    0%  { transform:translate(-50%,-42%) rotate(2deg);  animation-timing-function:cubic-bezier(.5,0,.75,.45); }
    45% { transform:translate(4%,-64%) rotate(28deg);   animation-timing-function:cubic-bezier(.18,.6,.32,1); }
    100%{ transform:translate(47%,-76%) rotate(55deg); }
  }
  .fig-keeper.dive .sh-f{ transform:rotate(-158deg); }
  .fig-keeper.dive .sh-b{ transform:rotate(160deg); }
  .fig-keeper.dive .el-f{ transform:rotate(-14deg); }
  .fig-keeper.dive .el-b{ transform:rotate(12deg); }
  .fig-keeper.dive .hip-f{ transform:rotate(-16deg); }
  .fig-keeper.dive .hip-b{ transform:rotate(10deg); }
  .fig-keeper.dive .knee-f{ transform:rotate(-8deg); }
  .fig-keeper.dive .knee-b{ transform:rotate(22deg); }

  /* beaten — gravity takes over and he comes down inside the goalmouth */
  .fig-keeper.land{ transform:translate(59%, -46%) rotate(86deg);
    animation:keeperLand .38s cubic-bezier(.55,0,.85,.55) forwards; }
  @keyframes keeperLand{
    from{ transform:translate(47%,-76%) rotate(55deg); }
    to  { transform:translate(59%,-46%) rotate(86deg); }
  }
  .fig-keeper.land .sh-f{ transform:rotate(-146deg); }
  .fig-keeper.land .sh-b{ transform:rotate(148deg); }
  .fig-keeper.land .knee-b{ transform:rotate(34deg); }

  /* --- referee --- */
  .fig-ref{ left:15%; top:50%; transform:translate(-50%,-50%); width:52px; }
  .fig-ref .jersey{ fill:#12161C; }
  .fig-ref .collar{ fill:#F5D33A; }
  .fig-ref .shorts-p{ fill:#12161C; }
  .fig-ref .sock{ stroke:#12161C; }
  .fig-ref .foot{ stroke:#0A0C10; }
  .fig-ref .jt{ transition:transform 0.3s cubic-bezier(.3,1.4,.5,1); }
  .fig-ref.blow .sh-f{ transform:rotate(-152deg); }
  .fig-ref.blow .el-f{ transform:rotate(-18deg); }
  .fig-ref.blow .sh-b{ transform:rotate(16deg); }

  .whistle-fx{ position:absolute; top:22%; left:50%; width:6px; height:6px; pointer-events:none; }
  .wave{ position:absolute; top:0; left:0; width:6px; height:6px; border-radius:50%; border:1.5px solid var(--gold); opacity:0; transform:translate(-50%,-50%); }
  .fig-ref.blow .wave-1{ animation:waveOut 0.7s ease-out; }
  .fig-ref.blow .wave-2{ animation:waveOut 0.7s ease-out 0.12s; }
  .fig-ref.blow .wave-3{ animation:waveOut 0.7s ease-out 0.24s; }
  @keyframes waveOut{ 0%{ opacity:0.85; width:6px; height:6px; } 100%{ opacity:0; width:56px; height:56px; } }

  .scene-fade{ transition:opacity 0.55s ease; }
  .scene-fade.fadeout{ opacity:0; }

  /* ================= BALL ================= */
  .ball-pos{
    position:absolute; left:43%; top:86%; transform:translate(-50%,-50%); z-index:6;
    transition:left 1.1s cubic-bezier(.4,.05,.3,1), top 1.1s cubic-bezier(.4,.05,.3,1);
  }
  /* one continuous strike: bends left of the straight line, whips out to the corner,
     buries into the net past the target point, then the net throws it back out */
  .ball-pos.flight{ animation:shotFlight 0.85s forwards; }
  @keyframes shotFlight{
    0%  { left:43%;   top:86%;   animation-timing-function:cubic-bezier(.18,.6,.5,.95); }
    42% { left:54%;   top:43%;   animation-timing-function:cubic-bezier(.5,.05,.65,.9); }
    86% { left:72.6%; top:9.6%;  animation-timing-function:cubic-bezier(.2,.8,.4,1); }
    100%{ left:71.6%; top:10.8%; }
  }

  .ball-flight{ offset-rotate:0deg; offset-distance:0%; will-change:transform; }
  .ball-flight.go{ offset-distance:100%; transition:offset-distance .85s cubic-bezier(.2,.72,.3,1); }

  .flight .ball-persp, .go .ball-persp{ animation:perspShrink 0.85s ease forwards; }
  @keyframes perspShrink{ from{ transform:scale(1); } to{ transform:scale(.54); } }
  .zoom .ball-persp{ animation:perspBack 1.1s ease forwards; }
  @keyframes perspBack{ from{ transform:scale(.54); } to{ transform:scale(1); } }

  .ball-scale{ transition:transform 1.1s cubic-bezier(.5,0,.4,1); }
  .zoom .ball-scale{ transform:scale(6.4); }

  .ball-spin{ animation:ballSpin 0.9s linear infinite; animation-play-state:paused; }
  .ball-spin.spinning{ animation-play-state:running; animation-duration:0.26s; }
  .ball-spin.slowspin{ animation-play-state:running; animation-duration:1.1s; }
  @keyframes ballSpin{ to{ transform:rotate(360deg); } }

  .pen-ball{ width:34px; height:34px; display:block; }
  .pen-ball .seams{ transition:opacity .55s ease; }
  .pen-ball .logoface{ opacity:0; transition:opacity .6s ease .15s; }
  .pen-ball.reveal .seams{ opacity:0; }
  .pen-ball.reveal .logoface{ opacity:1; }
  .pen-ball.squash{ animation:ballSquash .18s cubic-bezier(.2,.9,.4,1); }
  @keyframes ballSquash{ 0%{ transform:scale(1); } 40%{ transform:scale(1.18,.8) rotate(-8deg); } 100%{ transform:scale(1); } }

  .impact{
    position:absolute; left:43%; top:86%; width:10px; height:10px;
    transform:translate(-50%,-50%); border-radius:50%;
    border:2px solid rgba(255,255,255,.9); opacity:0; z-index:5; pointer-events:none;
  }
  .impact.pop{ animation:impactPop .32s ease-out; }
  @keyframes impactPop{
    0%{ opacity:.9; width:8px; height:8px; border-width:3px; }
    100%{ opacity:0; width:56px; height:56px; border-width:1px; }
  }

  .ball-shadow{
    position:absolute; left:50%; top:26px; width:26px; height:8px; border-radius:50%;
    background:rgba(0,0,0,0.5); filter:blur(3px); transform:translateX(-50%);
    transition:opacity 0.42s ease, transform 0.42s ease; z-index:-1;
  }
  .flight .ball-shadow, .go .ball-shadow{ animation:shadowGone .45s ease forwards; }
  @keyframes shadowGone{ to{ opacity:0; transform:translateX(-50%) scale(.35); } }

  .goal-flash{
    position:absolute; left:50%; top:36%; transform:translate(-50%,-50%) scale(0.6);
    opacity:0; font-family:'Anton',sans-serif; font-size:3rem; color:var(--gold);
    letter-spacing:0.06em; text-shadow:0 0 30px rgba(212,166,42,0.65); z-index:7;
    transition:opacity 0.28s ease, transform 0.35s cubic-bezier(.2,1.6,.4,1);
  }
  .goal-flash.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .stadium-flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:15; }
  .stadium-flash.pop{ animation:flashPop .4s ease-out; }
  @keyframes flashPop{ 0%{ opacity:0; } 22%{ opacity:.22; } 100%{ opacity:0; } }



  /* ================= NAV ================= */
  header{ position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem clamp(1.5rem,5vw,4rem); background:linear-gradient(to bottom, rgba(11,31,58,0.92), rgba(11,31,58,0)); backdrop-filter:blur(2px); }
  .logo{ font-family:'Anton',sans-serif; font-size:1.2rem; letter-spacing:0.05em; display:flex; align-items:center; gap:0.5rem; }
  .logo-dot{ width:9px; height:9px; border-radius:50%; background:var(--gold); }
  nav ul{ display:flex; gap:2.2rem; list-style:none; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
  nav a{ color:var(--chalk-dim); transition:color 0.2s; }
  nav a:hover{ color:var(--gold); }
  @media (max-width:720px){ nav{display:none;} }

  /* ================= PAGE ================= */
  .hero{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative;
    padding:8rem clamp(1.5rem,6vw,5rem) 4rem;
    background:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(31,122,77,0.35), transparent 60%), linear-gradient(180deg, var(--navy) 0%, #081527 100%);
    overflow:hidden; }
  .hero::after{ content:""; position:absolute; left:0; right:0; bottom:-2%; height:38%;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 90px);
    transform:perspective(500px) rotateX(58deg); transform-origin:bottom; pointer-events:none; }
  .hero h1{ font-size:clamp(3rem,9vw,7.5rem); max-width:16ch; position:relative; z-index:2; }
  .hero h1 .accent{ color:var(--pitch-light); }
  .hero p.lede{ margin-top:1.6rem; max-width:46ch; font-size:1.1rem; color:var(--chalk-dim); line-height:1.6; position:relative; z-index:2; }
  .hero-actions{ margin-top:2.6rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; position:relative; z-index:2; }
  .btn{ padding:0.95rem 1.8rem; border-radius:999px; font-weight:700; font-size:0.9rem; display:inline-flex; align-items:center; gap:0.5rem; cursor:pointer; border:none; }
  .btn-primary{ background:var(--ember); color:var(--chalk); }
  .btn-primary:hover{ background:#c33d26; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--chalk); }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold); }

  .scoreboard{ margin-top:3rem; display:inline-flex; flex-wrap:wrap; justify-content:center; gap:0.9rem; position:relative; z-index:2; }
  .score-cell{ background:var(--navy-light); border:1px solid var(--line); border-radius:10px; padding:0.9rem 1.1rem; min-width:78px; text-align:center; }
  .score-cell .num-c{ font-family:'JetBrains Mono',monospace; font-size:1.9rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  .score-cell .label{ font-family:'JetBrains Mono',monospace; font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--chalk-dim); margin-top:0.3rem; }





  @media (max-width:640px){
    /* filters on animating SVG are the #1 mobile frame-killer */
    .fig-svg{ filter:none; }
    header{ backdrop-filter:none; }
    /* the stage is small on phones — zoom the ball further so the logo reads */
    .zoom .ball-scale{ transform:scale(9); }
    /* bottom controls: caption gets its own row above the buttons */
    .caption{ bottom:4.9rem; font-size:0.68rem; letter-spacing:0.22em; }
    .sound-toggle,.skip-intro{ bottom:1.2rem; padding:0.5rem 0.85rem; font-size:0.68rem; }
    .sound-toggle{ left:1.2rem; } .skip-intro{ right:1.2rem; }
    /* countdown fits a 360px screen */
    .score-cell{ min-width:64px; padding:0.7rem 0.55rem; }
    .score-cell .num-c{ font-size:1.45rem; }
    .scoreboard{ gap:0.55rem; }
  }
</style>
<noscript>
  <!-- File previewers (WhatsApp/QuickLook) and JS-off browsers render HTML+CSS but
       run no JavaScript. The intro is JS-driven, so without JS we skip straight
       to the page; the Register link is a plain anchor and still works. -->
  <style>#intro{display:none !important;}</style>
</noscript>

      <div class="score-cell"><div class="num-c mono" id="cd-hours">00</div><div class="label">Hours</div></div>
      <div class="score-cell"><div class="num-c mono" id="cd-mins">00</div><div class="label">Mins</div></div>
      <div class="score-cell"><div class="num-c mono" id="cd-secs">00</div><div class="label">Secs</div></div>
    </div>
    <div class="hero-actions">
      <a href="register.html" class="btn btn-primary">Register now →</a>
    </div>
  </section>


<script>
/* ---------------- Figure builder ----------------
   One articulated body plan, three characters.
   Joints are nested <g> elements rotated about anatomical pivots.        */
function figureSVG(opts){
  const o = Object.assign({ number:null, gloves:false, sleeve:'#ffffff' }, opts);
  const num = o.number ? `<text class="num" x="60" y="90">${o.number}</text>` : '';
  const gloveF = o.gloves ? `<circle class="glove" cx="79" cy="106" r="7.5"/>` : `<circle cx="79" cy="105" r="6" fill="var(--skin)"/>`;
  const gloveB = o.gloves ? `<circle class="glove" cx="41" cy="106" r="7.5"/>` : `<circle cx="41" cy="105" r="6" fill="var(--skin)"/>`;

  return `
<svg class="fig-svg" viewBox="0 0 120 212" xmlns="http://www.w3.org/2000/svg">
 <g class="root">
  <g class="torso-pivot">

   <!-- back leg -->
   <g class="jt hip-b">
     <path class="limb thigh" d="M54,130 L53,167" stroke="var(--skin-dk)"/>
     <g class="jt knee-b">
       <path class="limb shin sock" d="M53,167 L52,195"/>
       <g class="jt ankle-b"><path class="limb foot" d="M52,195 L62,199"/></g>
     </g>
   </g>

   <!-- front leg -->
   <g class="jt hip-f">
     <path class="limb thigh" d="M66,130 L65,167" stroke="var(--skin)"/>
     <g class="jt knee-f">
       <path class="limb shin sock" d="M65,167 L64,195"/>
       <g class="jt ankle-f"><path class="limb foot" d="M64,195 L74,199"/></g>
     </g>
   </g>

   <!-- back arm -->
   <g class="jt sh-b">
     <path class="limb uarm" d="M47,55 L43,81" stroke="var(--skin-dk)"/>
     <g class="jt el-b">
       <path class="limb farm" d="M43,81 L41,104" stroke="var(--skin-dk)"/>
       ${gloveB}
     </g>
   </g>

   <!-- torso -->
   <path class="jersey" d="M45,50 C39,55 36,68 37,84 C37,96 40,105 42,111 L78,111 C80,105 83,96 83,84 C84,68 81,55 75,50 C70,45.5 50,45.5 45,50 Z"/>
   <path class="collar" d="M52,47.5 C56,52 64,52 68,47.5 C64,45 56,45 52,47.5 Z"/>
   <path class="shorts-p" d="M42,109 L78,109 C79.5,119 78.5,129 77.5,137 L64,137 L60,121 L56,137 L42.5,137 C41.5,129 40.5,119 42,109 Z"/>
   ${num}

   <!-- head on a neck joint so it can track the ball -->
   <g class="jt neckj">
     <path class="limb neckline" d="M60,38 L60,49" stroke="var(--skin-dk)"/>
     <ellipse cx="60" cy="25" rx="12.5" ry="14.5" fill="var(--skin)"/>
     <path d="M47.6,22 C47.2,15 52,8.5 60,8.5 C68,8.5 72.8,15 72.4,22 C70,14 50,14 47.6,22 Z" fill="var(--hair)"/>
     <ellipse cx="60" cy="25" rx="12.5" ry="14.5" fill="url(#faceShade)" opacity="0.35"/>
   </g>

   <!-- front arm -->
   <g class="jt sh-f">
     <path class="limb uarm" d="M73,55 L77,81" stroke="var(--skin)"/>
     <g class="jt el-f">
       <path class="limb farm" d="M77,81 L79,104" stroke="var(--skin)"/>
       ${gloveF}
     </g>
   </g>

  </g>
 </g>
 <defs>
   <radialGradient id="faceShade" cx="35%" cy="28%" r="75%">
     <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
     <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
   </radialGradient>
 </defs>
</svg>`;
}

document.getElementById('player').insertAdjacentHTML('afterbegin', figureSVG({ number:'10' }));
document.getElementById('keeper').insertAdjacentHTML('afterbegin', figureSVG({ gloves:true }));
document.getElementById('referee').insertAdjacentHTML('afterbegin', figureSVG({}));

/* ---------------- Intro timeline ---------------- */
const intro     = document.getElementById('intro');
const skipBtn   = document.getElementById('skipIntro');
const caption   = document.getElementById('caption');
const referee   = document.getElementById('referee');
const player    = document.getElementById('player');
const keeper    = document.getElementById('keeper');
const ballPos   = document.getElementById('ballPos');
const ballFlight= document.getElementById('ballFlight');
const ballSpin  = document.getElementById('ballSpin');
const goalFlash = document.getElementById('goalFlash');
const net       = document.getElementById('net');
const camera    = document.getElementById('camera');
const field     = document.getElementById('field');
const impact    = document.getElementById('impact');
const stadiumFlash = document.getElementById('stadiumFlash');
const penBall   = document.querySelector('.pen-ball');
const soundBtn  = document.getElementById('soundBtn');
const replayBtn = document.getElementById('replayBtn');
const sceneFadeEls = document.querySelectorAll('.scene-fade');

let timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const setCamera = cls => {
  camera.classList.remove('cam-kicker','cam-wide','cam-goal','cam-neutral');
  camera.classList.add(cls);
};
const say = txt => { caption.textContent = txt; caption.classList.add('show'); };
let endIntro = () => { intro.classList.add('done'); document.body.classList.add('intro-done'); };

/* ---- synthesized sound (no audio files) ---- */
let actx = null, soundOn = false;
function ac(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }
  return actx;
}
function noiseBuf(ctx, secs){
  const b = ctx.createBuffer(1, ctx.sampleRate*secs, ctx.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return b;
}
function sfxWhistle(){
  const ctx = ac(); if(!ctx) return; const t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value = 3850;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3850; bp.Q.value=6;
  const g  = ctx.createGain(); g.gain.value = 0;
  /* the pea rattle: ~34Hz tremolo on the blast */
  const lfo = ctx.createOscillator(); lfo.frequency.value = 34;
  const lg  = ctx.createGain(); lg.gain.value = 0.11;
  lfo.connect(lg); lg.connect(g.gain);
  osc.connect(bp); bp.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.22, t+0.015);
  g.gain.setValueAtTime(0.22, t+0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.62);
  osc.start(t); lfo.start(t); osc.stop(t+0.65); lfo.stop(t+0.65);
}
function sfxKick(){
  const ctx = ac(); if(!ctx) return; const t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type='sine';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(52, t+0.12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.14);
  osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+0.15);
  const nz = ctx.createBufferSource(); nz.buffer = noiseBuf(ctx, 0.06);
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.32, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t+0.05);
  nz.connect(hp); hp.connect(ng); ng.connect(ctx.destination); nz.start(t);
}
function sfxWhoosh(){
  const ctx = ac(); if(!ctx) return; const t = ctx.currentTime;
  const nz = ctx.createBufferSource(); nz.buffer = noiseBuf(ctx, 0.5);
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(500, t);
  bp.frequency.exponentialRampToValueAtTime(2600, t+0.4);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.2, t+0.12);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.45);
  nz.connect(bp); bp.connect(g); g.connect(ctx.destination); nz.start(t);
}
function sfxNet(){
  const ctx = ac(); if(!ctx) return; const t = ctx.currentTime;
  const nz = ctx.createBufferSource(); nz.buffer = noiseBuf(ctx, 0.22);
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=0.8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
  nz.connect(bp); bp.connect(g); g.connect(ctx.destination); nz.start(t);
  const th = ctx.createOscillator(); th.type='sine'; th.frequency.value=95;
  const tg = ctx.createGain(); tg.gain.setValueAtTime(0.25, t);
  tg.gain.exponentialRampToValueAtTime(0.001, t+0.1);
  th.connect(tg); tg.connect(ctx.destination); th.start(t); th.stop(t+0.12);
}
function sfxCrowd(){
  const ctx = ac(); if(!ctx) return; const t = ctx.currentTime;
  const mk = (fq, q, peak, atk, dur) => {
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf(ctx, dur); 
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fq; f.Q.value=q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t+atk);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    nz.connect(f); f.connect(g); g.connect(ctx.destination); nz.start(t);
  };
  mk(420, 0.7, 0.45, 0.18, 3.0);   /* body of the roar */
  mk(1100, 0.9, 0.22, 0.12, 2.2);  /* top end */
}
const cue = fn => { if(soundOn && actx && actx.state === 'running') fn(); };

/* stop the spin where it is, then decelerate through to upright */
function settleSpin(){
  let ang = 0;
  const cs = getComputedStyle(ballSpin).transform;
  if(cs && cs !== 'none'){
    const m = cs.match(/matrix\(([^)]+)\)/);
    if(m){ const v = m[1].split(',').map(parseFloat); ang = Math.atan2(v[1], v[0]) * 180/Math.PI; }
  }
  if(ang < 0) ang += 360;
  ballSpin.classList.remove('spinning','slowspin');
  ballSpin.style.animation = 'none';
  ballSpin.style.transform = `rotate(${ang}deg)`;
  void ballSpin.offsetWidth;
  ballSpin.style.transition = 'transform 1.05s cubic-bezier(.15,.65,.25,1)';
  ballSpin.style.transform = 'rotate(360deg)';
}

function enableSound(on){
  soundOn = on;
  if(on){ const ctx = ac(); if(ctx && ctx.state === 'suspended') ctx.resume(); }
  soundBtn.textContent = on ? '\uD83D\uDD0A Sound on' : '\uD83D\uDD07 Sound';
  soundBtn.classList.toggle('on', on);
}
soundBtn.addEventListener('click', () => enableSound(!soundOn));

/* ---- ball flight: real curved motion path in px, sized to this screen ---- */
const smoothPath = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('offset-path','path("M0 0 L1 1")');
function launchBall(){
  if(smoothPath){
    const r = field.getBoundingClientRect();
    if(r.width > 0){
      /* the path lives in the stage's local space — always 700x437.5 by design */
      const px = p => p/100*700, py = p => p/100*437.5;
      const viewScale = r.width / 700;   /* stage scale x camera scale, as rendered */
      /* start (43,86) -> control (50.1,38) -> pressed into the corner netting (72.6,9.6) -> settles just off the woodwork (71.6,10.8) */
      const cx = px(50.1-43),  cy = py(38-86);
      const dx = px(72.6-43),  dy = py(9.6-86);
      const rx = px(71.6-43),  ry = py(10.8-86);
      const mkPath = (ox, oy) =>
        `path('M ${ox.toFixed(1)} ${oy.toFixed(1)} Q ${(cx+ox).toFixed(1)} ${(cy+oy).toFixed(1)} ${(dx+ox).toFixed(1)} ${(dy+oy).toFixed(1)} L ${(rx+ox).toFixed(1)} ${(ry+oy).toFixed(1)}')`;

      /* Engines disagree on where a motion path anchors the element, which can
         shift the whole flight by half the ball. Calibrate instead of assuming:
         apply the raw path at distance 0, measure the displacement it caused,
         then rebuild the path with that delta cancelled out. */
      const before = ballFlight.getBoundingClientRect();
      ballFlight.style.offsetPath = mkPath(0, 0);
      ballFlight.style.offsetDistance = '0%';
      void ballFlight.offsetWidth;
      const after = ballFlight.getBoundingClientRect();
      const shiftX = after.left - before.left;
      const shiftY = after.top  - before.top;
      if(Math.abs(shiftX) > 0.5 || Math.abs(shiftY) > 0.5){
        /* the shift was measured on screen; the path is in local units */
        ballFlight.style.offsetPath = mkPath(-shiftX/viewScale, -shiftY/viewScale);
      }
      ballFlight.style.offsetDistance = '';
      void ballFlight.offsetWidth;
      ballFlight.classList.add('go');
      /* verify the ball actually left the spot — some mobile engines accept the
         property but never run the transition; if so, switch to the keyframe path */
      const home = ballFlight.getBoundingClientRect();
      timers.push(setTimeout(() => {
        const now = ballFlight.getBoundingClientRect();
        if (Math.abs(now.left - home.left) < 12 && Math.abs(now.top - home.top) < 12){
          ballFlight.classList.remove('go');
          ballFlight.style.offsetPath = '';
          ballFlight.style.offsetDistance = '';
          ballPos.classList.add('flight');
        }
      }, 150));
      return;
    }
  }
  ballPos.classList.add('flight');   /* fallback: keyframed left/top */
}

function runTimeline(){
  at(250,  () => say('No.10 steps up'));
  at(1150, () => { referee.classList.add('blow'); keeper.classList.add('set'); cue(sfxWhistle); });
  at(1250, () => say('Referee\u2019s whistle'));
  at(1750, () => caption.classList.remove('show'));
  at(1800, () => setCamera('cam-wide'));

  /* strike animation runs 1.55s; boot meets ball at 72% \u2248 1.12s */
  at(2000, () => player.classList.add('kick'));

  const CONTACT = 2000 + 1120;
  at(CONTACT - 140, () => { keeper.classList.remove('set'); keeper.classList.add('load'); }); /* reads the swing, sinks */
  at(CONTACT, () => {
    launchBall();
    ballSpin.classList.add('spinning');
    penBall.classList.add('squash');
    impact.classList.add('pop');
    field.classList.add('shake');
    cue(sfxKick); cue(sfxWhoosh);
  });
  at(CONTACT + 100, () => keeper.classList.add('dive'));   /* explodes the right way */
  at(CONTACT + 730, () => {                                /* ball buries into the net */
    net.classList.add('ripple');
    keeper.classList.add('land');                          /* beaten \u2014 comes down */
    cue(sfxNet);
  });
  at(CONTACT + 830, () => {
    goalFlash.classList.add('show');
    stadiumFlash.classList.add('pop');
    setCamera('cam-goal');
    say('Top corner');
    cue(sfxCrowd);
  });
  at(CONTACT + 1650, () => {
    caption.classList.remove('show');
    goalFlash.classList.remove('show');
    setCamera('cam-neutral');
    sceneFadeEls.forEach(el => el.classList.add('fadeout'));
    ballSpin.classList.remove('spinning');
    ballSpin.classList.add('slowspin');
    /* hand the ball from the flight to the zoom transition without a snap:
       pin it at the corner with transitions off, commit, then release toward center */
    ballPos.classList.remove('flight');
    ballFlight.classList.remove('go');
    ballFlight.style.offsetPath = 'none';
    ballFlight.style.offsetDistance = '';
    ballPos.style.transition = 'none';
    ballPos.style.left = '71.6%';
    ballPos.style.top  = '10.8%';
    void ballPos.offsetWidth;
    ballPos.style.transition = '';
    ballPos.classList.add('zoom');
    ballPos.style.left = '50%';
    ballPos.style.top  = '50%';
  });
  at(CONTACT + 2850, () => { settleSpin(); penBall.classList.add('reveal'); });
  at(CONTACT + 4550, endIntro);
}

function resetIntro(){
  timers.forEach(clearTimeout); timers = [];
  document.body.classList.remove('intro-done');
  intro.classList.remove('done');
  caption.classList.remove('show'); caption.textContent = 'No.10 steps up';
  referee.classList.remove('blow');
  keeper.classList.remove('set','load','dive','land');
  player.classList.remove('kick');
  ballPos.classList.remove('flight','zoom');
  ballPos.style.left = ''; ballPos.style.top = ''; ballPos.style.transition = '';
  ballFlight.classList.remove('go'); ballFlight.style.offsetPath = ''; ballFlight.style.offsetDistance = '';
  ballSpin.classList.remove('spinning','slowspin');
  penBall.classList.remove('squash');
  impact.classList.remove('pop');
  net.classList.remove('ripple');
  goalFlash.classList.remove('show');
  stadiumFlash.classList.remove('pop');
  field.classList.remove('shake');
  sceneFadeEls.forEach(el => el.classList.remove('fadeout'));
  fitStage();
  penBall.classList.remove('reveal');
  ballSpin.style.animation = ''; ballSpin.style.transform = ''; ballSpin.style.transition = '';
  setCamera('cam-kicker');
}

skipBtn.addEventListener('click', () => { timers.forEach(clearTimeout); endIntro(); });

/* whatever happens — a throw, a stalled animation, an odd engine — the page must appear */
let watchdog = null;
function armWatchdog(){ clearTimeout(watchdog); watchdog = setTimeout(endIntro, 12500); }
const _endIntro = endIntro;
endIntro = () => { clearTimeout(watchdog); _endIntro(); };

const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* the scene is authored at 700x437.5 and scaled as one unit to fit any screen */
const stage = document.getElementById('stage');
function fitStage(){
  const s = Math.min(1, (window.innerWidth*0.94)/700, (window.innerHeight*0.90)/437.5);
  stage.style.setProperty('--stage-s', s.toFixed(4));
}
fitStage();
window.addEventListener('resize', fitStage);

replayBtn.addEventListener('click', () => {
  if (REDUCED_MOTION) return;
  enableSound(true);          /* the click is the gesture browsers require for audio */
  resetIntro();
  armWatchdog();
  requestAnimationFrame(() => requestAnimationFrame(runTimeline));
});

if (REDUCED_MOTION){
  /* a 7-second frozen black screen is not an intro — go straight to the page */
  endIntro();
  replayBtn.style.display = 'none';
} else {
  armWatchdog();
  try { runTimeline(); } catch(e){ endIntro(); }
}

/* ---------------- Countdown ---------------- */
const TARGET_DATE = new Date(2026, 8, 3, 0, 0, 0);   /* September 3, local time */
const pad = n => String(n).padStart(2,'0');
function updateCountdown(){
  const diff = Math.max(0, TARGET_DATE - new Date());
  document.getElementById('cd-days').textContent  = pad(Math.floor(diff/86400000));
  document.getElementById('cd-hours').textContent = pad(Math.floor(diff/3600000)%24);
  document.getElementById('cd-mins').textContent  = pad(Math.floor(diff/60000)%60);
  document.getElementById('cd-secs').textContent  = pad(Math.floor(diff/1000)%60);
}
updateCountdown();
setInterval(updateCountdown, 1000);


</script>

</body>
</html>
